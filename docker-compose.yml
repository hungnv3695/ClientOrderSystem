services:
  frontend:
    build: ./ClientOrderWeb
    ports:
      - "5173:5173"
    volumes:
      - ./ClientOrderWeb:/app
    environment:
      - HOST=0.0.0.0
    command: npm run dev -- --host
    depends_on:
      - backend
      - print

  backend:
    build: ./ClientOrderServer
    ports:
      - "3000:3000"
    volumes:
      - ./ClientOrderServer:/app
    env_file:
      - ./ClientOrderServer/.env.development
    environment:
      - NODE_ENV=development
    depends_on:
      - db

  print:
    build: ./ClientOrderPrint
    ports:
      - "3003:3003"
    volumes:
      - ./ClientOrderPrint:/app
    environment:
      - NODE_ENV=development
      - PORT=3003
    networks:
      - default
      - printer_network
    restart: unless-stopped

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  db_data:
  pgadmin_data:

networks:
  default:
    driver: bridge
  printer_network:
    driver: bridge
