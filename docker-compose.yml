services:
  frontend:
    build: ./ClientOrderWeb
    ports:
      - "5173:5173"
    volumes:
      - ./ClientOrderWeb:/app
    environment:
      - HOST=0.0.0.0
    command: npm run dev -- --host
    depends_on:
      - backend

  backend:
    build: ./ClientOrderServer
    ports:
      - "3000:3000"
    volumes:
      - ./ClientOrderServer:/app
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=order_db
      - DB_PORT=5432
    depends_on:
      - db

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
